<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page not found — Andrew Ung Wei En</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f6f8fb;
      font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
      color: #0b1220;
      padding: 24px;
    }
    .card {
      max-width: 440px;
      padding: 34px 36px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
    }
    .kicker {
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #526071;
    }
    h1 {
      font-size: clamp(30px, 6vw, 44px);
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin: 12px 0 10px;
    }
    p {
      margin: 0 0 20px;
      color: #526071;
      font-size: 15px;
      line-height: 1.65;
    }
    a {
      display: inline-block;
      color: #2563eb;
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid #cbd5e1;
      padding-bottom: 2px;
    }
    a:hover { border-color: #2563eb; }
  </style>
</head>
<body>
  <div class="card">
    <p class="kicker">Error 404</p>
    <h1>That page doesn't exist.</h1>
    <p>The address doesn't match anything on this site. Head back to the portfolio to browse all twelve projects and their case studies.</p>
    <a href="/portfolio/">Back to the portfolio</a>
  </div>
</body>
</html>
